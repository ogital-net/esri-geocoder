[package]
name = "arcgis-geocoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
description = "Async Rust client for the ArcGIS World Geocoding Service"
license = "BSD-2-Clause"
readme = "README.md"
repository = "https://github.com/ogital-net/arcgis-geocoder"
homepage = "https://github.com/ogital-net/arcgis-geocoder"
documentation = "https://docs.rs/arcgis-geocoder"
keywords = ["arcgis", "geocoding", "geocode", "esri", "maps"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = ["CLAUDE.md", ".github/**", "tests/oauth_integration.rs"]

[features]
default = ["serde_json"]
serde_json = ["dep:serde_json"]
sonic-rs   = ["dep:sonic-rs"]
simd-json  = ["dep:simd-json"]

[dependencies]
reqwest      = { version = "0.13", default-features = false, features = ["rustls", "http2", "query", "form"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", optional = true }
sonic-rs     = { version = "0", optional = true }
simd-json    = { version = "0", optional = true }
thiserror    = "2"
log          = "0"
tokio        = { version = "1", default-features = false, features = ["sync"] }

[dev-dependencies]
serde_json  = "1"
wiremock    = "0.6"
tokio       = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy     = "0.15"
env_logger  = "0.11"
